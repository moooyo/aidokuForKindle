[package]
name = "aidoku-kindle"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
description = "A native e-ink manga reader for Kindle"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "aidoku"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-software", "slint/unstable-winit-030"]
kindle = ["dep:slint-backend-kindle"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ego-tree = "0.10"
flate2 = "1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
png = "0.18"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "gzip", "deflate"] }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "unstable-fontique-010"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
url = "2"
wasmi = "0.46"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
slint-backend-kindle = { path = "vendor/slint-backend-kindle", optional = true }

[build-dependencies]
serde_json = "1"
slint-build = "=1.17.1"

[dev-dependencies]
tempfile = "3"
wat = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false
