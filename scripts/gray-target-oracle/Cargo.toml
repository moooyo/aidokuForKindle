[package]
name = "gray-target-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "0.2"
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-path"] }

[profile.release]
debug = 0

[[bin]]
name = "gray-target-oracle"
path = "main.rs"
